<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="박개미의 아침">
<meta name="theme-color" content="#040a1c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>박개미의 배고픈 아침</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* Layout: one 16:9 game stage centered on a night-blue ground; HUD lives inside the stage and scales with it (cqw). On phones in landscape the stage fills the screen and the camera zooms in. */
:root{
  --night:#040a1c;
  --panel:rgba(8,18,44,.9);
  --edge:#4aa3ff;
  --edge-soft:#24508f;
  --ink:#eef5ff;
  --muted:#9db4d8;
  --gold:#ffd25a;
  --paper:#f5f9ff;
  --paper-ink:#14203d;
  --navy:#183463;
  --pick:#dcebff;
  --ui:"Jua","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);margin:0;overflow:hidden;box-sizing:border-box;padding-inline:16px;padding-block:10px;display:flex;align-items:center;justify-content:center;font-family:var(--body)}
#stage{position:relative;aspect-ratio:16/9;max-width:100%;container-type:inline-size;border-radius:10px;overflow:hidden;background:#050b1f;box-shadow:0 0 0 1px var(--edge-soft),0 18px 60px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:.25cqw solid var(--gold);outline-offset:.2cqw}
kbd{font-family:var(--body);font-weight:800;color:var(--ink);background:#0a1430;border:.12cqw solid #47689c;border-bottom-width:.25cqw;border-radius:.3cqw;padding:0 .45cqw;margin-right:.3cqw}

#mapname{position:absolute;left:1.6cqw;top:1.6cqw;display:flex;align-items:center;gap:1cqw;padding:.7cqw 1.6cqw .7cqw 1cqw;background:var(--panel);border:.2cqw solid var(--edge);border-radius:.8cqw;font-family:var(--ui);font-size:2cqw;box-shadow:0 0 1.4cqw rgba(74,163,255,.35)}
#mapname .mon{width:2.6cqw;height:1.9cqw;border-radius:.3cqw;background:linear-gradient(#7fd4ff,#2f7de0);box-shadow:inset 0 0 0 .2cqw #cdeeff;position:relative}
#mapname .mon::after{content:"";position:absolute;left:35%;right:35%;bottom:-.6cqw;height:.45cqw;background:#9fbde6;border-radius:.1cqw}
#section{position:absolute;left:1.6cqw;top:6.6cqw;font-family:var(--ui);font-size:1.5cqw;color:var(--gold);background:rgba(8,18,44,.75);padding:.4cqw 1cqw;border-radius:.6cqw;letter-spacing:.03em}
#side{position:absolute;right:1.6cqw;top:1.6cqw;width:28cqw;display:flex;flex-direction:column;gap:.8cqw;align-items:stretch}
#quest{background:var(--panel);border:.2cqw solid var(--edge-soft);border-radius:.8cqw;padding:1cqw 1.3cqw;display:flex;flex-direction:column;gap:.5cqw}
#quest .qlabel{font-family:var(--ui);font-size:1.25cqw;color:var(--gold);letter-spacing:.12em}
#quest .qname{font-family:var(--ui);font-size:1.75cqw}
#quest .qgoal{font-size:1.35cqw;color:var(--muted);line-height:1.5}
#quest .qgoal b{color:var(--ink)}
#quest .qgoal b.ok{color:#7dffb0}
#items{display:flex;flex-direction:column;gap:.5cqw;align-items:flex-end}
.it{display:flex;align-items:center;gap:.8cqw;background:var(--panel);border:.2cqw solid var(--edge-soft);border-radius:.8cqw;padding:.35cqw 1cqw .35cqw .5cqw}
.it .ib{width:3.6cqw;height:3.6cqw;border-radius:.6cqw;background:radial-gradient(circle at 50% 40%,#2a4a86,#0d1a3a);display:flex;align-items:center;justify-content:center;flex:none}
.it img{max-width:3.2cqw;max-height:3cqw}
.it .in{font-weight:800;font-size:1.3cqw}
.it .ic{font-family:var(--ui);font-size:1.9cqw;color:var(--gold);font-variant-numeric:tabular-nums;min-width:3.6cqw;text-align:right}
.it.pop{animation:ipop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes ipop{from{transform:scale(1.25)}}

#bar{position:absolute;left:0;right:0;bottom:0;height:4.6cqw;display:flex;align-items:center;gap:1.4cqw;padding-inline:1.4cqw;background:linear-gradient(#16264d,#0b1634);border-top:.2cqw solid #33598f}
#bar .lv{font-family:var(--ui);font-size:1.7cqw;color:var(--gold)}
#bar .nm{font-family:var(--ui);font-size:1.6cqw;display:flex;align-items:center;gap:.5cqw}
#bar .nm img{height:2.6cqw}
#exp{position:relative;width:26cqw;height:1.8cqw;background:#081028;border:.15cqw solid #47689c;border-radius:.4cqw;overflow:hidden}
#expfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#ffe98a,#e9b51e);transition:width 1.2s ease}
#exptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.1cqw;font-weight:800;color:#fff;text-shadow:0 0 .3cqw #000;font-variant-numeric:tabular-nums}
#keys{margin-left:auto;font-size:1.1cqw;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

#toast{position:absolute;left:50%;top:16%;transform:translate(-50%,-.6cqw);opacity:0;transition:opacity .25s,transform .25s;background:var(--panel);border:.2cqw solid var(--gold);color:var(--ink);font-family:var(--ui);font-size:1.9cqw;padding:.8cqw 2cqw;border-radius:.8cqw;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:1cqw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast img{height:2.8cqw}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#banner.on{opacity:1}
#banner .b1{font-family:var(--ui);font-size:4.4cqw;color:#fff;text-shadow:0 0 1.5cqw #2f8cff,0 .3cqw 0 #0b1b45}
#banner .b2{font-family:var(--ui);font-size:1.6cqw;color:#bfe0ff;margin-top:.6cqw}

#dialog{position:absolute;left:5%;right:5%;bottom:7.5cqw;height:15cqw;display:flex;gap:1.6cqw;background:var(--paper);color:var(--paper-ink);border:.35cqw solid var(--navy);border-radius:1.2cqw;box-shadow:inset 0 0 0 .3cqw #a9d0ff,0 1cqw 2.4cqw rgba(0,0,0,.5);padding:1.4cqw 2cqw 1.2cqw 1.4cqw}
.portrait{width:13cqw;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.5cqw;background:linear-gradient(#e3efff,#c8ddfa);border-radius:.8cqw;padding:.6cqw;overflow:hidden}
.portrait img{max-height:9.6cqw;max-width:11cqw;object-fit:contain}
#dlgName{background:var(--navy);color:var(--gold);font-family:var(--ui);font-size:1.45cqw;padding:.15cqw 1.2cqw;border-radius:.5cqw;white-space:nowrap}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column}
#dlgText{font-weight:800;font-size:2cqw;line-height:1.65;margin:0;word-break:keep-all}
#dlgChoices{display:flex;flex-direction:column;gap:.3cqw;margin-top:.6cqw}
#dlgChoices button{border:0;background:none;text-align:left;font-family:var(--body);font-weight:800;font-size:1.8cqw;color:#1d4f9e;padding:.25cqw .9cqw;border-radius:.5cqw}
#dlgChoices button.sel{background:var(--pick)}
#dlgNext{margin-top:auto;align-self:flex-end;font-size:1.2cqw;color:#5a77a8;font-weight:800;animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateY(.3cqw)}}

.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,8,24,.72)}
#title{background:radial-gradient(ellipse at 50% 40%,rgba(255,150,40,.22),rgba(3,8,24,.92) 70%)}
.tcard{display:flex;flex-direction:column;align-items:center;gap:1.3cqw;text-align:center}
.tsub{font-family:var(--ui);font-size:1.7cqw;color:#ffcf8a;letter-spacing:.2em}
.tname{font-family:var(--ui);font-weight:400;font-size:6.2cqw;line-height:1.05;margin:0;color:#fff;text-shadow:0 0 2cqw #ff9a2f,0 .45cqw 0 #3a1b05;text-wrap:balance}
.tcast{display:flex;align-items:flex-end;gap:2.6cqw;height:13cqw}
.tcast figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.5cqw}
.tcast img{height:11cqw;animation:bob 1.6s ease-in-out infinite}
.tcast figure:nth-child(2) img{animation-delay:.3s}
.tcast figure:nth-child(3) img{animation-delay:.6s;height:10.4cqw}
.tcast figure:nth-child(4) img{animation-delay:.9s;height:5.6cqw}
.tcast figcaption{font-family:var(--ui);font-size:1.3cqw;background:rgba(8,18,44,.85);padding:.1cqw .9cqw;border-radius:.4cqw}
@keyframes bob{50%{transform:translateY(-.6cqw)}}
.big{font-family:var(--ui);font-size:2.2cqw;color:#10224a;background:linear-gradient(#ffe98a,#f0b929);border:.25cqw solid #fff2bf;border-radius:1cqw;padding:.7cqw 3.4cqw;box-shadow:0 .4cqw 0 #a66f00,0 0 2cqw rgba(255,210,90,.4)}
.big:active{transform:translateY(.3cqw);box-shadow:0 .1cqw 0 #a66f00}
.ghost{font-family:var(--ui);font-size:1.7cqw;color:var(--ink);background:rgba(8,18,44,.8);border:.2cqw solid var(--edge-soft);border-radius:1cqw;padding:.6cqw 2.4cqw}
.thelp{font-size:1.25cqw;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;gap:.6cqw 1.6cqw;max-width:72cqw}
.pcard{background:var(--panel);border:.25cqw solid var(--edge);border-radius:1.2cqw;padding:2.4cqw 3.6cqw;display:flex;flex-direction:column;align-items:center;gap:1.4cqw}
.pcard h2{font-family:var(--ui);font-weight:400;font-size:3cqw;margin:0}
.prow{display:flex;gap:1.2cqw;flex-wrap:wrap;justify-content:center}

#complete{background:rgba(3,8,24,.55)}
.qc{width:46cqw;background:linear-gradient(#1b2f63,#0c1838);border:.35cqw solid var(--gold);border-radius:1.4cqw;box-shadow:0 0 0 .3cqw #6a4b00,0 0 4cqw rgba(255,210,90,.35);padding:2cqw 2.6cqw;display:flex;flex-direction:column;gap:1.4cqw;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.qc-head{text-align:center;display:flex;flex-direction:column;gap:.4cqw}
.qc-quest{font-family:var(--ui);font-size:1.6cqw;color:#bfe0ff}
.qc-title{font-family:var(--ui);font-weight:400;font-size:4.6cqw;color:var(--gold);text-shadow:0 .35cqw 0 #6a4b00,0 0 1.6cqw rgba(255,210,90,.6);letter-spacing:.03em}
.qc-rewards{list-style:none;margin:0;padding:1.2cqw 1.6cqw;background:rgba(0,0,0,.25);border-radius:.8cqw;display:flex;flex-direction:column;gap:.8cqw}
.qc-rewards .rl{font-family:var(--ui);font-size:1.3cqw;color:var(--gold);letter-spacing:.12em}
.qc-rewards li{display:flex;align-items:center;gap:1cqw;font-weight:800;font-size:1.7cqw}
.ico{width:3cqw;height:3cqw;flex:none;border-radius:.6cqw;display:flex;align-items:center;justify-content:center;font-family:var(--ui);font-size:1.15cqw;color:#10224a}
.ico.exp{background:linear-gradient(#ffe98a,#e9b51e)}
.ico.vid{background:linear-gradient(#c9b6ff,#7d5cff);font-size:1.4cqw;color:#fff}
.ico.medal{background:linear-gradient(#ffd7a8,#ff9a2f);overflow:hidden}
.ico.medal img{max-width:2.6cqw;max-height:2.4cqw}

#touch{position:fixed;inset:0;pointer-events:none;z-index:5}
.tb{pointer-events:auto;position:absolute;width:17vmin;height:17vmin;padding:0;border-radius:50%;background:rgba(10,24,60,.55);border:2px solid rgba(160,200,255,.55);color:#fff;font-family:var(--ui);font-size:6vmin;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.tb.on{background:rgba(74,163,255,.7);border-color:#cfe6ff}
.tb.l{left:calc(3vmin + env(safe-area-inset-left,0px));bottom:calc(14vmin + env(safe-area-inset-bottom,0px))}
.tb.r{left:calc(39vmin + env(safe-area-inset-left,0px));bottom:calc(14vmin + env(safe-area-inset-bottom,0px))}
.tb.u{left:calc(21vmin + env(safe-area-inset-left,0px));bottom:calc(28vmin + env(safe-area-inset-bottom,0px))}
.tb.d{left:calc(21vmin + env(safe-area-inset-left,0px));bottom:calc(1vmin + env(safe-area-inset-bottom,0px))}
.tb.jump{right:calc(3vmin + env(safe-area-inset-right,0px));bottom:calc(8vmin + env(safe-area-inset-bottom,0px));width:22vmin;height:22vmin;font-size:6.5vmin}
.tb.atk{right:calc(27vmin + env(safe-area-inset-right,0px));bottom:calc(3vmin + env(safe-area-inset-bottom,0px))}
.tb.talk{right:calc(8vmin + env(safe-area-inset-right,0px));bottom:calc(32vmin + env(safe-area-inset-bottom,0px));font-size:5vmin}
.tb.pz{left:50%;transform:translateX(-50%);bottom:calc(3vmin + env(safe-area-inset-bottom,0px));width:11vmin;height:11vmin;font-size:4vmin}
html,body{touch-action:none;-webkit-text-size-adjust:100%}
body.touch{-webkit-touch-callout:none}
#touch.off{display:none}
body.touch #keys,body.touch .thelp{display:none}
#rotate{display:none;position:fixed;left:16px;right:16px;top:calc(56.25vw + 30px);text-align:center;font-family:var(--ui);font-size:4.4vw;color:var(--muted);pointer-events:none}
#rotate b{color:var(--gold);font-weight:400}
body.touch #quest .qlabel,body.touch #quest .qname{display:none}
body.touch #side{width:21cqw;right:1cqw;top:1cqw;gap:.5cqw}
body.touch #quest{padding:.6cqw .9cqw}
body.touch #quest .qgoal{font-size:1.25cqw;line-height:1.4}
body.touch .it{padding:.2cqw .7cqw .2cqw .3cqw;gap:.5cqw}
body.touch .it .ib{width:2.8cqw;height:2.8cqw}
body.touch .it .in{font-size:1.1cqw}
body.touch .it .ic{font-size:1.5cqw;min-width:2.8cqw}
body.touch #mapname{left:1cqw;top:1cqw;font-size:1.5cqw;padding:.4cqw 1cqw .4cqw .6cqw;gap:.6cqw}
body.touch #mapname .mon{width:1.9cqw;height:1.4cqw}
body.touch #section{left:1cqw;top:4.6cqw;font-size:1.2cqw}
body.touch #toast{font-size:1.6cqw;top:12%}
@media (orientation:landscape){body.touch{padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}body.touch #stage{border-radius:0;box-shadow:none}body.touch #bar{justify-content:center}.tb.pz{top:calc(2vmin + env(safe-area-inset-top,0px));bottom:auto}}
@media (orientation:portrait){body.touch #rotate{display:block}body.touch{align-items:flex-start;padding-block:12px}.tb.pz{bottom:calc(50vmin + env(safe-area-inset-bottom,0px))}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tcast img,#dlgNext,.qc,.it.pop{animation:none}}
</style>

<div id="stage">
  <canvas id="cv" aria-label="게임 화면"></canvas>

  <div id="mapname"><span class="mon"></span><span id="mapnameText">박개미의 영상 작업실</span></div>
  <div id="section" hidden></div>
  <div id="side">
    <div id="quest" hidden>
      <span class="qlabel">QUEST</span>
      <span class="qname">박개미의 배고픈 아침</span>
      <span class="qgoal" id="qgoal"></span>
    </div>
    <div id="items"></div>
  </div>
  <div id="bar">
    <span class="lv" id="lv">Lv.30</span><span class="nm"><img id="barClub" alt="">박지연</span>
    <div id="exp"><i id="expfill"></i><b id="exptext"></b></div>
    <div id="keys"><kbd>←→</kbd>이동 <kbd>Space</kbd>점프 <kbd>X</kbd>공격 <kbd>↑↓</kbd>사다리·포탈 <kbd>Z</kbd>대화 <kbd>Esc</kbd>일시정지</div>
  </div>

  <div id="toast"></div>
  <div id="banner"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>

  <div id="dialog" hidden>
    <div class="portrait"><img id="dlgImg" alt=""><span id="dlgName"></span></div>
    <div class="dbody">
      <p id="dlgText"></p>
      <div id="dlgChoices"></div>
      <div id="dlgNext">Enter ▼</div>
    </div>
  </div>


  <div id="title" class="screen">
    <div class="tcard">
      <span class="tsub">가산디지털단지 사냥 퀘스트</span>
      <h1 class="tname">박개미의 배고픈 아침</h1>
      <div class="tcast">
        <figure><img id="tJiyeon" alt="박지연"><figcaption>박지연</figcaption></figure>
        <figure><img id="tGaemi" alt="박개미"><figcaption>박개미</figcaption></figure>
        <figure><img id="tOwner" alt="편의점 사장님"><figcaption>편의점 사장님</figcaption></figure>
        <figure><img id="tMush" alt="주황버섯"><figcaption>주황버섯</figcaption></figure>
      </div>
      <button class="big" id="btnStart">게임 시작</button>
      <div class="thelp"><span><kbd>←→</kbd>이동</span><span><kbd>Space</kbd>점프</span><span><kbd>X</kbd>몽둥이 공격</span><span><kbd>↑</kbd>포탈·사다리</span><span><kbd>↓</kbd>사다리 내려가기</span><span><kbd>Z</kbd>대화</span><span><kbd>Enter</kbd>대사 넘기기</span></div>
    </div>
  </div>

  <div id="pause" class="screen" hidden>
    <div class="pcard">
      <h2>일시정지</h2>
      <div class="prow"><button class="big" id="btnResume">계속하기</button><button class="ghost" id="btnRestart">처음부터 다시</button></div>
    </div>
  </div>

  <div id="complete" class="screen" hidden>
    <div class="qc">
      <div class="qc-head"><span class="qc-quest">박개미의 배고픈 아침</span><strong class="qc-title">QUEST COMPLETE!</strong></div>
      <ul class="qc-rewards">
        <span class="rl">보상</span>
        <li><span class="ico exp">EXP</span>경험치 +10,000</li>
        <li><span class="ico vid">▶</span>박개미의 완성 영상</li>
        <li><span class="ico medal"><img id="medalImg" alt=""></span>칭호: 김밥셔틀</li>
      </ul>
      <div class="prow"><button class="big" id="btnContinue">계속 둘러보기</button><button class="ghost" id="btnRestart2">처음부터 다시하기</button></div>
    </div>
  </div>

  <div id="fade"></div>
</div>

<p id="rotate">📱 휴대폰을 <b>가로로 돌리면</b> 화면이 더 크게 보여요</p>
<div id="touch" hidden>
  <button data-k="ArrowLeft" class="tb l" aria-label="왼쪽">◀</button>
  <button data-k="ArrowRight" class="tb r" aria-label="오른쪽">▶</button>
  <button data-k="ArrowUp" class="tb u" aria-label="위">▲</button>
  <button data-k="ArrowDown" class="tb d" aria-label="아래">▼</button>
  <button data-k="KeyZ" class="tb talk">대화</button>

function rng(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- background painting ---------- */
function rack(g, x, y, w, h, R, leds) {
  g.fillStyle = '#0c1733'; g.fillRect(x, y, w, h);
  g.fillStyle = '#1b2f5c'; g.fillRect(x, y, w, 5);
  g.strokeStyle = '#26447f'; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2);
  const cols = ['#3dff8a', '#ffcf3d', '#ff5a6a', '#4dc3ff', '#3dff8a', '#4dc3ff'];
  for (let sy = y + 9; sy < y + h - 9; sy += 9) {
    g.fillStyle = '#13254a'; g.fillRect(x + 5, sy, w - 10, 7);
    const n = 1 + (R() * 3 | 0);
    for (let k = 0; k < n; k++) {
      const lx = x + 8 + k * 5, c = cols[R() * cols.length | 0];
      g.fillStyle = c; g.globalAlpha = .35; g.fillRect(lx, sy + 2, 3, 3); g.globalAlpha = 1;
      if (R() < .5) leds.push({ x: lx, y: sy + 2, c, s: R() * 10, r: .6 + R() * 2.2 });
    }
  }
}
function lamp(g, x, y) {

  g.fillStyle = gr; g.fillRect(x - 130, y - 20, 260, 170);
  g.fillStyle = '#26365a'; g.fillRect(x - 34, y - 4, 68, 6);
  g.fillStyle = '#d6f6ff'; g.fillRect(x - 30, y + 2, 60, 5);
}
function pillar(g, x, y0, y1) {
  g.fillStyle = '#152448'; g.fillRect(x - 20, y0, 40, y1 - y0);
  g.fillStyle = '#1f3566'; g.fillRect(x - 20, y0, 4, y1 - y0); g.fillRect(x + 16, y0, 4, y1 - y0);
  g.strokeStyle = 'rgba(70,110,180,.35)'; g.lineWidth = 3;
  for (let y = y0; y < y1; y += 110) { g.beginPath(); g.moveTo(x - 16, y); g.lineTo(x + 16, y + 110); g.moveTo(x + 16, y); g.lineTo(x - 16, y + 110); g.stroke(); }
}
function bundle(g, x1, y1, x2, y2, sag) {
  for (let i = 0; i < 4; i++) {

    g.strokeStyle = i % 2 ? '#0b1736' : '#12285a'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(x1, y1 + o); g.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + sag + o, x2, y2 + o); g.stroke();
  }
}
function monitor(g, x, y) {

  g.fillStyle = '#2f8fe8'; g.fillRect(x + 4, y + 4, 46, 26);
  g.fillStyle = 'rgba(210,240,255,.8)'; for (let i = 0; i < 4; i++) g.fillRect(x + 8, y + 8 + i * 5, 14 + (i * 7 % 20), 2);
  g.fillStyle = '#26365a'; g.fillRect(x + 24, y + 36, 6, 8); g.fillRect(x + 16, y + 44, 22, 3);

function makeBG(w, h, seed, tiers, pillars, opts) {
  opts = opts || {};
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), R = rng(seed), leds = [];
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#07122f'); gr.addColorStop(1, '#0b1f4d');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(40,80,160,.10)';
  for (let y = 0; y < h; y += 96) for (let x = (y / 96 % 2) * 60 - 60; x < w; x += 120) g.fillRect(x + 3, y + 3, 114, 90);
  for (const px of pillars) pillar(g, px, 0, h);
  for (const ty of tiers) {
    for (let i = 0; i < 2; i++) bundle(g, R() * w * .4, ty - 240 + R() * 40, w * .6 + R() * w * .4, ty - 250 + R() * 40, 40 + R() * 50);
    if (!opts.sparse) {
      let x = -10 + R() * 30;
      while (x < w) {
        const rw = 44 + (R() * 26 | 0), rh = 120 + (R() * 90 | 0);
        if (R() < .86) rack(g, x, ty - rh, rw, rh, R, leds); else monitor(g, x + 4, ty - 70);
        x += rw + 4 + (R() < .25 ? R() * 70 : 0);
      }
    } else {
      for (let x = 20 + R() * 60; x < w; x += 260 + R() * 160) { const rw = 50, rh = 130 + R() * 70; rack(g, x, ty - rh, rw, rh, R, leds); }
    }
    g.fillStyle = '#081129'; g.fillRect(0, ty, w, 10);
    g.fillStyle = 'rgba(90,170,255,.3)'; g.fillRect(0, ty, w, 2);
    for (let lx = 50 + R() * 80; lx < w; lx += 220 + R() * 90) lamp(g, lx, ty - 255);
  }
  return { canvas: c, g, leds };
}

function update(dt) {

  if (P.inv <= 0 && !window.__noHaz) {
    const b = { x: P.x - PW / 2 + 3, y: P.y - PH + 6, w: PW - 6, h: PH - 8 };
    let done = false;
    for (const h of MAP.hazards) { const hx = hazardHit(h, b); if (hx != null) { hurt(hx); done = true; break; } }
    if (!done) for (const mb of MAP.mobs) {
      if (!mobAlive(mb)) continue;
      const m = mobBox(mb), mm = { x: m.x + 6, y: m.y + 8, w: m.w - 12, h: m.h - 8 };
      if (mm.x < b.x + b.w && mm.x + mm.w > b.x && mm.y < b.y + b.h && mm.y + mm.h > b.y) { hurt(mb.x, '아야!'); break; }
    }
  }
  for (const it of MAP.items) if (!it.taken && Math.abs(P.x - it.x) < 26 && P.y - PH < it.y + 12 && P.y > it.y - 12) touchItem(it);
  for (const s of MAP.sections) if (!Q.sections[s.n] && P.ground && P.y <= s.y) {
    Q.sections[s.n] = 1; $('section').hidden = false;
    $('section').textContent = s.n + '  ' + '★'.repeat(s.s) + '☆'.repeat(5 - s.s); sectionT = 3.5;
  }
  if (P.y > MAP.h + 120) { P.x = MAP.spawn.x; P.y = MAP.spawn.y; P.vy = 0; P.ground = groundUnder(P.x, P.y); }
  if (MAP.id === 'office' && P.x > 360) Q.movedRight = true;
  if (MAP.id === 'top' && Q.state === 4 && !Q.hinted) { Q.hinted = true; }
  const k = 1 - Math.exp(-dt * 7);
  cam.x += (clamp(P.x - VW / 2, 0, Math.max(0, MAP.w - VW)) - cam.x) * k;
  cam.y += (clamp(P.y - VH * .62, 0, MAP.h - VH + BAR) - cam.y) * k;
  for (const h of MAP.hazards) if (((h.type === 'cable' || h.type === 'laser') && cycle(h) === 'on' && Math.random() < dt * 8) || h.type === 'spark' && Math.random() < dt * 6) {
    const p = h.type === 'cable' ? cablePoint(h, Math.random()) : h.type === 'spark' ? { x: h.x1 + Math.random() * (h.x2 - h.x1), y: h.y - 8 } : h.dir === 'h' ? { x: h.x1 + Math.random() * (h.x2 - h.x1), y: h.y } : { x: h.x, y: h.y1 + Math.random() * (h.y2 - h.y1) };
    FX.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 120, vy: (Math.random() - .8) * 120, life: .3, max: .3, k: h.type === 'laser' ? 'ember' : 'spark' });
  }
}
function updateFx(dt) {

    const f = FX[i]; f.life -= dt;
    if (f.life <= 0) { FX.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.k === 'heart') f.vy += 20 * dt; else if (f.k !== 'dust') f.vy += 300 * dt;
  }
  for (let i = TEXTS.length - 1; i >= 0; i--) { const t = TEXTS[i]; t.life -= dt; t.y -= dt * (t.dmg ? 55 : 40); if (t.life <= 0) TEXTS.splice(i, 1); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
  if (sectionT > 0) { sectionT -= dt; if (sectionT <= 0) $('section').hidden = true; }
  if (TR) {

}

      ctx.lineWidth = 5; ctx.strokeStyle = t.crit ? '#3a0718' : '#3a1b05'; ctx.strokeText(t.t, x, y); ctx.fillStyle = gr; ctx.fillText(t.t, x, y);
    } else {
      ctx.font = (t.big ? '26px' : '18px') + ' Jua, sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = '#0b1b45'; ctx.strokeText(t.t, x, y); ctx.fillStyle = t.c; ctx.fillText(t.t, x, y);
    }
    ctx.globalAlpha = 1;
  }
}
function drawLeds() {
  const L = MAP.bg.leds;
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (l.y < cam.y - 4 || l.y > cam.y + VH + 4 || l.x < cam.x - 4 || l.x > cam.x + VW + 4) continue;
    if (Math.sin(T * l.r + l.s) > .2) { ctx.fillStyle = l.c; ctx.fillRect(l.x - cam.x, l.y - cam.y, 3, 3); }
  }
}
function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (!MAP) { ctx.fillStyle = '#050b1f'; ctx.fillRect(0, 0, VW, VH); return; }
  cam.x = Math.round(cam.x * 2) / 2; cam.y = Math.round(cam.y * 2) / 2;
  ctx.drawImage(MAP.bg.canvas, cam.x, cam.y, VW, VH, 0, 0, VW, VH);
  drawLeds();
  for (const l of MAP.ladders) drawLadder(l);
  for (const pl of MAP.plats) drawPlat(pl);
  for (const p of MAP.portals) drawPortal(p);
  for (const it of MAP.items) drawUsb(it);
  for (const n of MAP.npcs) drawNPC(n);
  for (const mb of MAP.mobs) drawMob(mb);
  drawDrops();
  drawPlayer();
  for (const h of MAP.hazards) drawHazard(h);
  drawFx();
  if (!vignette) { vignette = ctx.createRadialGradient(VW / 2, VH / 2, VH * .45, VW / 2, VH / 2, VH * 1.05); vignette.addColorStop(0, 'rgba(0,0,0,0)'); vignette.addColorStop(1, 'rgba(0,4,20,.55)'); }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, VW, VH);
}

/* ---------- loop & sizing ---------- */
function resize() {
  const touch = document.body.classList.contains('touch'), cs = getComputedStyle(document.body);
  const aw = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = document.body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let w, h;
  if (touch && aw > ah) { w = Math.floor(aw); h = Math.floor(ah); VH = 400; VW = Math.round(VH * w / h); }
  else {
    w = Math.max(200, Math.floor(Math.min(aw, ah * 16 / 9))); h = Math.floor(w * 9 / 16);
    if (touch) { VH = 400; VW = Math.round(400 * 16 / 9); } else { VW = 960; VH = 540; }
  }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = cv.height / VH; vignette = null;
}
addEventListener('resize', resize);
let last = performance.now(), acc = 0; let touchOff = null;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (screen === 'play' && !paused && !window.__manual) {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  }
  const ctlOff = screen !== 'play' || DLG.open || completeOpen || paused;
  if (ctlOff !== touchOff) { touchOff = ctlOff; $('touch').classList.toggle('off', ctlOff); }
  updateDialog(dt); updateFx(paused ? 0 : dt);
  render();
  requestAnimationFrame(frame);
}
resize();
resetWorld();
MAP = MAPS.office; cam.x = 0; cam.y = 0;
requestAnimationFrame(frame);
setTimeout(() => $('btnStart').focus(), 100);

window.__G = { P, Q, INV, keys, get MAP() { return MAP; }, MAPS: () => MAPS, update, loadMap, startGame, press, DLG, groundUnder, updatePlatforms, attack };
</script>
